{{define "admin_plans"}}
{{template "head" .}}
{{template "nav" .}}
<div class="container">
  <h1>会员计划</h1>
  {{if .Msg}}<div class="msg">{{.Msg}}</div>{{end}}
  <div class="card">
    <form method="post" action="/admin/plans">
      <div class="form-row"><label>名称</label><input name="name" required></div>
      <div class="form-row"><label>类型</label><input name="type" required></div>
      <div class="form-row"><label>价格(分)</label><input name="value" type="number" required></div>
      <div class="form-row"><label>描述</label><input name="des"></div>
      <button class="btn green" type="submit">新增计划</button>
    </form>
  </div>
  <table>
    <tr><th>名称</th><th>类型</th><th>价格(元)</th><th>描述</th><th>操作</th></tr>
    {{range .Plans}}
    <tr>
      <td>{{.Name}}</td><td>{{.Type}}</td><td>{{printf "%.2f" (yuan .Value)}}</td><td>{{.Description}}</td>
      <td>
        <form method="post" action="/admin/plans/{{.UUID}}" style="display:inline">
          <input name="name" value="{{.Name}}" size="6">
          <input name="value" type="number" value="{{.Value}}" size="5">
          <input name="des" value="{{.Description}}" size="8">
          <button class="btn gray" type="submit">修改</button>
        </form>
      </td>
    </tr>
    {{end}}
  </table>
</div>
{{template "foot" .}}
{{end}}
