services:
  gubill:
    build: .
    image: gubill:latest
    container_name: gubill
    ports:
      - "8080:8080" # 用户端 API
      - "8081:8081" # 管理端 API
    # 配置以 cmd/main/config.yaml 为唯一来源（config 包读取后写入环境变量），
    # 生产环境请直接修改镜像内的 config.yaml（或挂载自定义配置文件并设置 CONFIG_PATH）。
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - gubill-data:/app/data
    restart: unless-stopped

volumes:
  gubill-data:
